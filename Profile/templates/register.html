 {% extends 'base.html' %}
 {%load crispy_forms_tags%}
 {%block content%}

 {%if messages%}
   <div class=".col-lg-3">
     
        {%for message in messages%}
        <p {%if message.tags%} class="text-{{message.tags}}" {%endif%}>{{message}}</p>
        {%endfor%}
     
   </div>
 {%endif%}
 
 <form method="post" class="container">
    {%csrf_token%}
    <h1>{{type}} Here</h1>
    {{form | crispy}}
    <button class="btn btn-warning" type="submit">Submit</button>
    
 </form>

 {%endblock%}
