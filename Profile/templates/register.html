 {% extends 'base.html' %}
 {%load crispy_forms_tags%}
 {%block content%}

 {%if messages%}
   <div class=".col-lg-3">
     
        {%for message in messages%}
        <p {%if message.tags%} class="text-{{message.tags}}" {%endif%}>{{message}}</p>
        {%endfor%}
     
   </div>
 {%endif%}
 
 <form method="post" class="container">
    {%csrf_token%}
    <h1>{{type}} Here</h1>
    {{form | crispy}}
    <button class="mt-4 inline-flex items-center justify-center rounded-2xl bg-gradient-to-r from-sky-500 via-cyan-500 to-emerald-500 px-4 py-2.5 text-sm font-semibold text-white shadow-lg shadow-cyan-200 transition duration-200 hover:-translate-y-0.5 hover:shadow-xl focus:outline-none focus:ring-2 focus:ring-cyan-300" type="submit">Submit</button>
    
 </form>

 {%endblock%}
