<div class="space-y-2">
  <label for="{{ field.id_for_label }}" class="text-sm font-medium text-slate-700">
    {{ field.label }}
  </label>
  {{ field }}
  {% if field.help_text %}
    <p class="text-xs text-slate-500">{{ field.help_text }}</p>
  {% endif %}
  {% if field.errors %}
    <ul class="space-y-1 text-sm text-rose-600">
      {% for error in field.errors %}
        <li>{{ error }}</li>
      {% endfor %}
    </ul>
  {% endif %}
</div>
