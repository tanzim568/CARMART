{% comment %}
Reusable button styles for consistent UI across the project.
{% endcomment %}

{% if button_type == 'primary' %}
  <button type="{{ button_type_attr|default:'button' }}" class="inline-flex items-center justify-center gap-2 rounded-xl border border-sky-600 bg-sky-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition duration-200 hover:-translate-y-0.5 hover:bg-sky-700 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-sky-500 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-60" {{ attrs|default:'' }}>
    {{ content }}
  </button>
{% elif button_type == 'secondary' %}
  <button type="{{ button_type_attr|default:'button' }}" class="inline-flex items-center justify-center gap-2 rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 shadow-sm transition duration-200 hover:-translate-y-0.5 hover:bg-slate-50 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-slate-300 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-60" {{ attrs|default:'' }}>
    {{ content }}
  </button>
{% elif button_type == 'danger' %}
  <button type="{{ button_type_attr|default:'button' }}" class="inline-flex items-center justify-center gap-2 rounded-xl border border-rose-500 bg-rose-500 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition duration-200 hover:-translate-y-0.5 hover:bg-rose-600 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-rose-400 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-60" {{ attrs|default:'' }}>
    {{ content }}
  </button>
{% elif button_type == 'success' %}
  <button type="{{ button_type_attr|default:'button' }}" class="inline-flex items-center justify-center gap-2 rounded-xl border border-emerald-500 bg-emerald-500 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition duration-200 hover:-translate-y-0.5 hover:bg-emerald-600 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-60" {{ attrs|default:'' }}>
    {{ content }}
  </button>
{% else %}
  <button type="{{ button_type_attr|default:'button' }}" class="inline-flex items-center justify-center gap-2 rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 shadow-sm transition duration-200 hover:-translate-y-0.5 hover:bg-slate-50 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-slate-300 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-60" {{ attrs|default:'' }}>
    {{ content }}
  </button>
{% endif %}
