{% url 'homepage' as home_url %}
{% url 'profile' as profile_url %}
{% url 'login' as login_url %}
{% url 'register' as register_url %}
{% url 'logout' as logout_url %}

<nav class="sticky top-0 z-40 border-b border-slate-200/80 bg-white/80 backdrop-blur-xl">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3 sm:px-6 lg:px-8">
    <a href="{{ home_url }}" class="flex items-center gap-3" aria-label="CarMart homepage">
      <div class="flex h-10 w-10 items-center justify-center rounded-2xl bg-sky-600 text-white shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
          <path d="M5 13.5 12 5l7 8.5V19a1 1 0 0 1-1 1h-3v-5H9v5H6a1 1 0 0 1-1-1z"/>
        </svg>
      </div>
      <div>
        <p class="text-sm font-semibold tracking-[0.2em] text-slate-500 uppercase">CarMart</p>
        <p class="text-base font-semibold text-slate-900">Premium Listings</p>
      </div>
    </a>

    <button id="mobile-nav-button" type="button" class="inline-flex items-center justify-center rounded-lg border border-slate-200 p-2 text-slate-700 transition hover:bg-slate-50 md:hidden" aria-controls="mobile-nav" aria-expanded="false" aria-label="Toggle navigation">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M4 12h16M4 17h16" />
      </svg>
    </button>

    <div id="mobile-nav" class="hidden md:flex md:items-center md:gap-2">
      <a href="{{ home_url }}" class="rounded-full px-4 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-900 {% if request.path == home_url %}bg-slate-100 text-slate-900{% endif %}">
        Home
      </a>

      {% if request.user.is_authenticated %}
        <a href="{{ profile_url }}" class="rounded-full px-4 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-900 {% if request.path == profile_url %}bg-slate-100 text-slate-900{% endif %}">
          Profile
        </a>
        <a href="{{ logout_url }}" class="rounded-full px-4 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-900">
          Logout
        </a>
      {% else %}
        <a href="{{ login_url }}" class="rounded-full px-4 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-900 {% if request.path == login_url %}bg-slate-100 text-slate-900{% endif %}">
          Login
        </a>
        <a href="{{ register_url }}" class="inline-flex items-center gap-2 rounded-full bg-sky-600 px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-sky-700">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M18 7.5 11.5 14 8 10.5" />
          </svg>
          Sign up
        </a>
      {% endif %}
    </div>
  </div>
</nav>
